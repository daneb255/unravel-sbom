name: Publish to PyPI

on:
  release:
    types: [published]   # triggers when a GitHub Release is published

permissions:
  contents: read
  id-token: write        # required for OIDC trusted publishing (no API token needed)

jobs:
  # ── Stage 1: test ──────────────────────────────────────────────────────────
  test:
    name: Test before publish
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Stage 2: build ─────────────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: test           # only runs if all test matrix jobs pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify distributions
        run: |
          pip install twine
          twine check dist/*

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Stage 3: smoke-test the TestPyPI release ───────────────────────────────
  smoke-test:
    name: Smoke-test TestPyPI install
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from TestPyPI
        run: |
          pip install --index-url https://test.pypi.org/simple/ \
                      --extra-index-url https://pypi.org/simple/ \
                      unravel-sbom

      - name: Verify CLI entry point
        run: unravel-sbom --version

      - name: Verify scan works on a temp directory
        run: |
          mkdir -p /tmp/smoke
          echo '{"dependencies": {"lodash": "^4.17.21"}}' > /tmp/smoke/package.json
          unravel-sbom scan /tmp/smoke -f cyclonedx -o /tmp/smoke/out.cdx.json
          python -c "
          import json, sys
          d = json.load(open('/tmp/smoke/out.cdx.json'))
          assert d['bomFormat'] == 'CycloneDX', 'wrong bomFormat'
          assert d['specVersion'] == '1.6', 'wrong specVersion'
          assert any(c['name'] == 'lodash' for c in d['components']), 'lodash not found'
          print('smoke test passed:', len(d['components']), 'component(s)')
          "

  # ── Stage 4: publish to production PyPI ────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: smoke-test
    environment:
      name: pypi
      url: https://pypi.org/p/unravel-sbom

    steps:
      - name: Download build artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC trusted publishing — no PYPI_API_TOKEN secret required.
        # Configure trusted publisher at: https://pypi.org/manage/account/publishing/
